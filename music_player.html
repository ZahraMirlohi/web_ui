{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title mb-0">
                        <i class="fas fa-music"></i> پخش کننده موسیقی مطالعه
                    </h3>
                </div>
                <div class="card-body">
                    <div class="row">
                        <!-- کنترل‌های اصلی -->
                        <div class="col-md-4">
                            <div class="control-panel">
                                <h5 class="text-center mb-4">🎵 کنترل‌های پخش</h5>
                                <div class="d-grid gap-3">
                                    <button id="play-btn" class="btn btn-success btn-lg py-3">
                                        <i class="fas fa-play"></i> پخش آهنگ انتخاب شده
                                    </button>
                                    <button id="stop-btn" class="btn btn-danger btn-lg py-3">
                                        <i class="fas fa-stop"></i> توقف پخش
                                    </button>
                                    <button id="refresh-list" class="btn btn-primary py-3">
                                        <i class="fas fa-sync-alt"></i> بروزرسانی لیست آهنگ‌ها
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- لیست آهنگ‌ها -->
                        <div class="col-md-8">
                            <div class="control-panel">
                                <h5 class="text-center mb-4">📀 لیست آهنگ‌های موجود</h5>
                                <div id="music-list" class="music-list" style="max-height: 400px; overflow-y: auto;">
                                    <div class="text-center text-muted py-4">
                                        <i class="fas fa-music fa-2x mb-2"></i>
                                        <p>در حال بارگذاری لیست آهنگ‌ها...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- کنترل‌های صدا -->
                    <div class="row mt-4">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="card-title mb-0">
                                        <i class="fas fa-volume-up"></i> کنترل‌های صدا
                                    </h5>
                                </div>
                                <div class="card-body">
                                    <div class="row text-center">
                                        <div class="col-md-2 mb-3">
                                            <button class="btn btn-warning btn-control-volume" data-action="mute">
                                                <i class="fas fa-volume-mute"></i><br>
                                                قطع صدا
                                            </button>
                                        </div>
                                        <div class="col-md-2 mb-3">
                                            <button class="btn btn-info btn-control-volume" data-action="volume_down">
                                                <i class="fas fa-volume-down"></i><br>
                                                کاهش صدا
                                            </button>
                                        </div>
                                        <div class="col-md-2 mb-3">
                                            <button class="btn btn-info btn-control-volume" data-action="volume_up">
                                                <i class="fas fa-volume-up"></i><br>
                                                افزایش صدا
                                            </button>
                                        </div>
                                        <div class="col-md-2 mb-3">
                                            <button class="btn btn-secondary btn-control-volume" data-action="play_pause">
                                                <i class="fas fa-play-pause"></i><br>
                                                توقف/ادامه
                                            </button>
                                        </div>
                                        <div class="col-md-2 mb-3">
                                            <button class="btn btn-dark btn-control-volume" data-action="stop">
                                                <i class="fas fa-stop"></i><br>
                                                توقف
                                            </button>
                                        </div>
                                        <div class="col-md-2 mb-3">
                                            <button id="stop-all" class="btn btn-danger">
                                                <i class="fas fa-stop-circle"></i><br>
                                                توقف همه
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- وضعیت پخش -->
                    <div class="row mt-4">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="card-title mb-0">
                                        <i class="fas fa-info-circle"></i> وضعیت پخش
                                    </h5>
                                </div>
                                <div class="card-body">
                                    <div id="player-status">
                                        <div class="text-center">
                                            <i class="fas fa-music fa-3x text-muted mb-3"></i>
                                            <p class="lead">پخش کننده موسیقی آماده است</p>
                                            <p class="text-muted">یک آهنگ از لیست انتخاب کنید و دکمه پخش را بزنید</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPlaying = null;
let isPlaying = false;

document.addEventListener('DOMContentLoaded', function() {
    const playBtn = document.getElementById('play-btn');
    const stopBtn = document.getElementById('stop-btn');
    const refreshBtn = document.getElementById('refresh-list');
    const stopAllBtn = document.getElementById('stop-all');
    const musicList = document.getElementById('music-list');
    const playerStatus = document.getElementById('player-status');
    const volumeControls = document.querySelectorAll('.btn-control-volume');

    // بارگذاری اولیه لیست آهنگ‌ها
    loadMusicList();

    // پخش آهنگ انتخاب شده
    playBtn.addEventListener('click', async function() {
        if (!currentPlaying) {
            showNotification('❌ لطفاً یک آهنگ از لیست انتخاب کنید', 'warning');
            return;
        }

        showNotification('🎵 در حال پخش آهنگ...', 'info');
        
        const result = await apiCall('/api/music/play', {
            method: 'POST',
            body: JSON.stringify({ file: currentPlaying })
        });

        if (result.status === 'success') {
            showNotification('✅ ' + result.message, 'success');
            updatePlayerStatus(`🎵 در حال پخش: <strong>${currentPlaying}</strong>`);
            highlightPlaying(currentPlaying);
            isPlaying = true;
        } else {
            showNotification('❌ ' + result.message, 'error');
        }
    });

    // توقف پخش
    stopBtn.addEventListener('click', async function() {
        const result = await apiCall('/api/music/stop', {
            method: 'POST'
        });

        if (result.status === 'success') {
            showNotification('⏹️ ' + result.message, 'success');
            updatePlayerStatus('⏹️ پخش متوقف شد');
            removeHighlight();
            isPlaying = false;
        }
    });

    // توقف همه
    stopAllBtn.addEventListener('click', async function() {
        const result = await apiCall('/api/music/stop', {
            method: 'POST'
        });

        if (result.status === 'success') {
            showNotification('🛑 ' + result.message, 'success');
            updatePlayerStatus('🛑 همه آهنگ‌ها متوقف شدند');
            removeHighlight();
            isPlaying = false;
        }
    });

    // کنترل‌های صدا
    volumeControls.forEach(btn => {
        btn.addEventListener('click', async function() {
            const action = this.getAttribute('data-action');
            const result = await apiCall('/api/music/control', {
                method: 'POST',
                body: JSON.stringify({ action: action })
            });

            if (result.status === 'success') {
                const actions = {
                    'mute': '🔇 صدا قطع شد',
                    'volume_down': '🔉 صدا کاهش یافت',
                    'volume_up': '🔊 صدا افزایش یافت',
                    'play_pause': '⏯️ حالت پخش تغییر کرد',
                    'stop': '⏹️ پخش متوقف شد'
                };
                showNotification(actions[action] || '✅ انجام شد', 'info');
            }
        });
    });

    // بروزرسانی لیست آهنگ‌ها
    refreshBtn.addEventListener('click', loadMusicList);

    // بارگذاری لیست آهنگ‌ها
    async function loadMusicList() {
        showNotification('🔄 در حال بارگذاری لیست آهنگ‌ها...', 'info');
        
        const result = await apiCall('/api/music/list');
        
        if (result.status === 'success' && result.data) {
            musicList.innerHTML = '';
            
            if (result.data.length === 0) {
                musicList.innerHTML = `
                    <div class="text-center text-muted py-4">
                        <i class="fas fa-folder-open fa-2x mb-2"></i>
                        <p>هیچ آهنگی در پوشه music یافت نشد</p>
                        <small>فایل‌های MP3 را در پوشه uploads/music قرار دهید</small>
                    </div>
                `;
                return;
            }

            result.data.forEach(file => {
                const musicItem = document.createElement('div');
                musicItem.className = 'music-item';
                musicItem.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <i class="fas fa-music text-primary me-2"></i>
                            <span class="music-filename">${file}</span>
                        </div>
                        <div>
                            <span class="badge bg-secondary">MP3</span>
                        </div>
                    </div>
                `;
                
                musicItem.addEventListener('click', function() {
                    currentPlaying = file;
                    showNotification(`🎵 آهنگ انتخاب شد: ${file}`, 'info');
                    highlightPlaying(file);
                    
                    // حذف هایلایت از سایر آیتم‌ها
                    document.querySelectorAll('.music-item').forEach(item => {
                        if (item !== musicItem) {
                            item.classList.remove('playing');
                        }
                    });
                    
                    musicItem.classList.add('playing');
                });
                
                musicList.appendChild(musicItem);
            });
            
            showNotification(`✅ ${result.data.length} آهنگ بارگذاری شد`, 'success');
        } else {
            musicList.innerHTML = `
                <div class="alert alert-danger text-center">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>خطا در بارگذاری لیست آهنگ‌ها</p>
                    <small>${result.message || 'خطای ناشناخته'}</small>
                </div>
            `;
        }
    }

    // هایلایت آهنگ در حال پخش
    function highlightPlaying(filename) {
        document.querySelectorAll('.music-item').forEach(item => {
            const itemFilename = item.querySelector('.music-filename').textContent;
            if (itemFilename === filename) {
                item.classList.add('playing');
                item.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });
    }

    // حذف هایلایت
    function removeHighlight() {
        document.querySelectorAll('.music-item').forEach(item => {
            item.classList.remove('playing');
        });
        currentPlaying = null;
    }

    // به روز رسانی وضعیت پخش
    function updatePlayerStatus(status) {
        playerStatus.innerHTML = `
            <div class="alert alert-info">
                <div class="d-flex align-items-center">
                    <i class="fas fa-music fa-2x me-3"></i>
                    <div>
                        <h5 class="mb-1">وضعیت پخش کننده</h5>
                        <p class="mb-0">${status}</p>
                    </div>
                </div>
            </div>
        `;
    }

    // بررسی دوره‌ای وضعیت پخش
    setInterval(async () => {
        if (isPlaying) {
            const result = await apiCall('/api/music/status');
            if (result.status === 'success' && !result.data.playing) {
                isPlaying = false;
                updatePlayerStatus('⏹️ پخش به پایان رسید');
                removeHighlight();
            }
        }
    }, 5000);
});
</script>

<style>
.music-item {
    padding: 12px 15px;
    border: 2px solid #e9ecef;
    border-radius: 10px;
    margin: 8px 0;
    cursor: pointer;
    transition: all 0.3s ease;
    background: white;
}

.music-item:hover {
    border-color: #3498db;
    background-color: #f8f9fa;
    transform: translateX(-5px);
}

.music-item.playing {
    border-color: #27ae60;
    background: linear-gradient(135deg, #27ae60, #2ecc71);
    color: white;
}

.music-item.playing .badge {
    background-color: white !important;
    color: #27ae60 !important;
}

.btn-control-volume {
    padding: 15px 5px;
    font-size: 0.9rem;
}

.music-list {
    scrollbar-width: thin;
    scrollbar-color: #3498db #f1f1f1;
}

.music-list::-webkit-scrollbar {
    width: 6px;
}

.music-list::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 3px;
}

.music-list::-webkit-scrollbar-thumb {
    background: #3498db;
    border-radius: 3px;
}

.music-list::-webkit-scrollbar-thumb:hover {
    background: #2980b9;
}
</style>
{% endblock %}
